<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ora Libera 17/18</title>
    <link rel="stylesheet" href="css/campus-theme.css">
    <link rel="stylesheet" href="css/uscita-style.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>
<div class="print-bar">
    <button class="btn" onclick="stampaFronteRetro()">STAMPA FRONTE-RETRO</button>
</div>
<div id="documento-da-stampare">
    <div class="header-main">
        <img src="assets/Logo.png" alt="Logo" class="print-logo">
        <h1><a href="index.html">Ora Libera 17/18</a></h1>
    </div>
    <div class="grid-wrapper">
        <div class="macro-column">
            <div class="column-header">
                <div class="cell-room">Room</div>
                <div class="cell-class">Classe</div>
                <div class="cell-name">Nome</div>
                <div class="cell-notes">Uscita</div>
                <div class="cell-notes">Ingresso</div>
            </div>
            <div id="col0" class="col-data"></div>
        </div>
        <div class="macro-column">
            <div class="column-header">
                <div class="cell-room">Room</div>
                <div class="cell-class">Classe</div>
                <div class="cell-name">Nome</div>
                <div class="cell-notes">Uscita</div>
                <div class="cell-notes">Ingresso</div>
            </div>
            <div id="col1" class="col-data"></div>
        </div>
    </div>
</div>

<script type="module">
    import { firebaseConfig } from "./js/firebase-config.js";
    firebase.initializeApp(firebaseConfig);
    import("./js/auth.js");

    const db = firebase.database();
    let studentiData = [];

    async function loadData() {
        const snap = await db.ref("studenti").once("value");
        const raw = snap.val();
        studentiData = raw ? Object.values(raw).filter(s => s.cognome && s.classe) : [];
        generaGriglia();
    }

    function generaGriglia() {
        const listaFinale = [...studentiData];
        listaFinale.sort((a,b) => a.cognome.localeCompare(b.cognome));
        const col0 = document.getElementById('col0');
        const col1 = document.getElementById('col1');
        col0.innerHTML = "";
        col1.innerHTML = "";
        const itemsPerCol = Math.ceil(listaFinale.length / 2);
        listaFinale.forEach((s, index) => {
            const colIndex = Math.floor(index / itemsPerCol);
            const colTarget = document.getElementById('col' + colIndex);
            if (!colTarget) return;
            const row = document.createElement('div');
            row.className = 'student-row';
            row.innerHTML = `
                <div class="cell-room">${s.room || '-'}</div>
                <div class="cell-class" style="font-size:0.85em; width:70px;">${[s.classe, s.percorso, s.gruppo].filter(Boolean).join(" ") || '-'}</div>
                <div class="cell-name" style="cursor:pointer;"><b>${s.cognome}</b> ${s.nome}</div>
                <div class="cell-notes"><div class="line-notes"></div></div>
                <div class="cell-notes"><div class="line-notes"></div></div>
            `;
            row.querySelector('.cell-name').addEventListener('click', () => row.classList.toggle('row-crossed'));
            colTarget.appendChild(row);
        });
    }

    window.stampaFronteRetro = () => {
        const originale = document.getElementById('documento-da-stampare');
        const clone = originale.cloneNode(true);
        clone.id = "documento-retro";
        document.body.appendChild(clone);
        window.print();
        clone.remove();
    };

    document.addEventListener("authReady", loadData);
</script>
</body>
</html>

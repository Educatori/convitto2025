<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cruscotto 1.0</title>
    <link rel="stylesheet" href="css/cruscotto-style.css">
</head>
<body>

    <div class="container">
        <header>
            <div>
                <h1> <a href="index.html" style="text-decoration: none; color: inherit;"> CRUSCOTTO </a> </h1>
                <div id="todayDate" style="font-size:0.9em; opacity:0.8;">Caricamento data...</div>
            </div>
            <div id="digitalClock" style="font-size:1.8em; font-weight:bold; font-family:monospace;">00:00:00</div>
        </header>

        <div class="note-toolbar-container">
            <div class="note-content">
                <span class="note-icon">📌</span>
                <input type="text" id="dailyNotes" placeholder="Inserisci note, promemoria o comunicazioni..." class="note-input">
                <button class="clear-note-btn" onclick="cancellaNote()" title="Svuota note">✕</button>
            </div>
        </div>       

        <div class="toolbar">
            <button class="btn-toolbar" style="background:var(--p);" onclick="togglePanel()">VARIABILI</button>
            <input type="text" id="search" placeholder="Cerca ..." onkeyup="applicaFiltri()">
            
            <div style="display:flex; align-items:center; gap:5px;">
                <span style="font-size:0.8em; font-weight:bold; color:var(--p);">ROOM:</span>
                <input type="number" id="roomInput" placeholder="n° ↕" min="101" max="221" style="width:60px;" 
                       onfocus="this.oldValue = this.value;" 
                       oninput="gestisciSaltoStanze(this); validaERicerca();">
            </div>

            <button class="btn-toolbar" style="background:var(--btn-reset);" onclick="resetDati()">RESET</button>
            <div id="info-reset" style="text-align:right; font-size:0.7em; color:#ff0000; margin-top:20px;">
                Ultimo aggiornamento: MAI
            </div>
        </div>

        <div style="display:flex; gap:10px; margin-bottom:20px; overflow-x:auto; padding-bottom:5px;">
            <div class="day-box" style="border-bottom:4px solid var(--btn-color-1)" onclick="setTurno(1)">1° TURNO (18:30)</div>
            <div class="day-box" style="border-bottom:4px solid var(--btn-color-2)" onclick="setTurno(2)">2° TURNO (19:15)</div>
            <div class="day-box" style="border-bottom:4px solid var(--btn-color-3)" onclick="generaPopUpStampaConvitto()">STAMPA CONVITTO</div>
            <div class="day-box" style="border-bottom:4px solid var(--btn-color-4)" onclick="generaPopUpStampaDinner()">STAMPA DINNER</div>
        </div>

        <div id="listaStudenti"></div>
    </div>

    <div id="sidePanel" style="position:fixed; top:0; right:-350px; width:320px; height:100%; background:white; box-shadow:-5px 0 15px rgba(0,0,0,0.1); transition:0.3s; z-index:1000; padding:20px; overflow-y:auto; display:flex; flex-direction:column;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3 style="margin:0;">Gestione Convitto</h3>
            <button onclick="togglePanel()" style="border:none; background:none; font-size:1.5em; cursor:pointer;">&times;</button>
        </div>
        <hr>
        <h3>Assenze Programmate</h3>
        <select id="selectStudente" style="width:100%; margin-bottom:6px;"><option value="">-- Seleziona Nome --</option></select>
        <select id="selectClasse" style="width:100%; margin-bottom:6px;"><option value="">-- Seleziona Classe --</option></select>
        <input type="date" id="dataDal" style="width:100%; margin-bottom:6px;">
        <input type="date" id="dataAl" style="width:100%; margin-bottom:10px;">
        <button onclick="aggiungiAssenza()" style="width:100%; background:#e74c3c; color:white; border:none; padding:8px; border-radius:5px; cursor:pointer;">➕ Aggiungi Assenza</button>
        <hr style="margin:20px 0;">
        <h3>Lista Assenze</h3>
        <div id="listaAssenze" style="margin-bottom:20px;"></div>
        <hr>
        <h3>Permessi Permanenti</h3>
        <div id="listaPermessiContent"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAKBQJYiu1ConaCKOj_rlKQSOQaGVTinCc",
            authDomain: "cruscotto-438bc.firebaseapp.com",
            databaseURL: "https://cruscotto-438bc-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "cruscotto-438bc",
            storageBucket: "cruscotto-438bc.firebasestorage.app",
            messagingSenderId: "142955041436",
            appId: "1:142955041436:web:22be8db6e293bf14c55359",
            measurementId: "G-LK93GN5JNP"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
    </script>

    <script src="js/convittori.js"></script>
    <script src="js/permessi.js"></script>
    <script src="js/cruscotto-script.js"></script>

    <script>
        const noteInput = document.getElementById('dailyNotes');

        // Sincronizzazione NOTE con Firebase
        db.ref('note_convitto').on('value', (snapshot) => {
            if (snapshot.exists()) noteInput.value = snapshot.val();
        });

        noteInput.addEventListener('input', () => {
            db.ref('note_convitto').set(noteInput.value);
        });

        function cancellaNote() {
            if(confirm("Vuoi cancellare definitivamente tutte le note?")) {
                db.ref('note_convitto').remove();
                noteInput.value = '';
            }
        }

        // Funzione RESET modificata per Firebase
        function resetDati() {
            if(confirm("Sei sicuro? Questo cancellerà i dati di OGGI per TUTTI gli utenti ⚠")) {
                db.ref('statoGiornaliero').remove(); // Cancella i dati sul server
                const ora = new Date().toLocaleString('it-IT');
                db.ref('ultimoReset').set(ora);
                location.reload();
            }
        }
        
        // Ascolta data ultimo reset
        db.ref('ultimoReset').on('value', (snapshot) => {
            document.getElementById('info-reset').innerText = "Ultimo reset: " + (snapshot.val() || "MAI");
        });
    </script>
</body>
</html>

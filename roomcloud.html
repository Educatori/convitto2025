<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Room Cloud 4.0</title>
    <link rel="stylesheet" href="css/campus-theme.css">
    <style>
        /* Stili essenziali per Room Cloud */
        body {
            padding: 12px;
            background: var(--bg);
            color: var(--text);
        }
        .app-header {
            background: var(--bg-2);
            border: 1px solid var(--border-2);
            padding: 14px 20px;
            border-radius: var(--radius-xl);
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .app-header h1 {
            font-size: 1.05rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .app-header button {
            padding: 8px 16px;
            border: none;
            border-radius: var(--radius);
            background: var(--btn-reset);
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 10px;
        }
        .room-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        .room-title {
            background: var(--bg-3);
            border-bottom: 1px solid var(--border);
            padding: 7px 10px;
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--accent);
        }
        .students-list {
            padding: 4px;
        }
        .student-item {
            padding: 7px 10px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background var(--t);
            position: relative;
            border-radius: 4px;
            margin-bottom: 2px;
        }
        .student-item:last-child {
            border-bottom: none;
        }
        .student-item.stato-assente {
            background: rgba(243,156,18,0.12) !important;
            border-left: 3px solid #f39c12;
        }
        .student-item.stato-confermato {
            background: rgba(231,76,60,0.10) !important;
            border-left: 3px solid #e74c3c;
        }
        .student-item.stato-attivita {
            background: rgba(56,217,169,0.10) !important;
            border-left: 3px solid #38d9a9;
        }
        .student-name {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text);
        }
        .student-class {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
            margin-top: 1px;
        }
        @media print {
            .app-header button { display: none; }
            .rooms-grid { grid-template-columns: repeat(3,1fr); }
        }
    </style>
    <!-- Firebase compat -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <!-- Configurazione Firebase (variabile globale) -->
    <script src="js/firebase-config.js"></script>
</head>
<body>
<div id="appScreen" style="display:none;">
    <div class="app-header">
        <h1><a href="index.html">Room Cloud 4.0</a></h1>
        <button onclick="logout()">Esci</button>
    </div>
    <div id="roomsGrid" class="rooms-grid"></div>
</div>

<script>
    // Inizializza Firebase (se non già fatto)
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.database();

    let studenti = [];
    let stati = {};

    // Carica studenti e stati da Firebase
    async function carica() {
        try {
            const snapStud = await db.ref("studenti").once("value");
            const raw = snapStud.val();
            studenti = raw ? Object.values(raw).filter(s => s.room && s.cognome) : [];
            const snapStati = await db.ref("roomcloud_stati").once("value");
            stati = snapStati.val() || {};
            render();
        } catch (e) {
            console.error("Errore caricamento:", e);
            alert("Errore nel caricamento dei dati: " + e.message);
        }
    }

    // Renderizza la griglia delle camere
    function render() {
        const stanze = {};
        studenti.forEach(s => {
            if (!stanze[s.room]) stanze[s.room] = [];
            stanze[s.room].push(s);
        });
        const grid = document.getElementById('roomsGrid');
        grid.innerHTML = "";
        Object.keys(stanze).sort((a, b) => parseInt(a) - parseInt(b)).forEach(room => {
            const card = document.createElement('div');
            card.className = 'room-card';
            card.innerHTML = `<div class="room-title">${room}</div><div class="students-list"></div>`;
            const list = card.querySelector('.students-list');
            stanze[room].forEach(s => {
                const id = `${s.cognome}_${s.nome}`.replace(/[^a-zA-Z0-9_-]/g, '_');
                const stato = stati[id] || {};
                const div = document.createElement('div');
                div.className = 'student-item';
                if (stato.stato === 'standby') div.classList.add('stato-assente');
                else if (stato.stato === 'assente') div.classList.add('stato-confermato');
                else if (stato.stato === 'attivita') div.classList.add('stato-attivita');
                div.innerHTML = `<div class="student-name">${s.cognome} ${s.nome}</div><div class="student-class">${s.classe}</div>`;
                div.onclick = (function(studId) {
                    return function() { sceltaStato(studId); };
                })(id);
                list.appendChild(div);
            });
            grid.appendChild(card);
        });
    }

    // Cambia lo stato di uno studente
    async function sceltaStato(id) {
        const scelta = prompt("Stato: standby, assente, attivita (o annulla)");
        if (!scelta) return;
        let statoValido = null;
        if (scelta === 'standby') statoValido = 'standby';
        else if (scelta === 'assente') statoValido = 'assente';
        else if (scelta === 'attivita') statoValido = 'attivita';
        else {
            alert("Valore non valido. Usa: standby, assente o attivita");
            return;
        }
        await db.ref(`roomcloud_stati/${id}`).set({ stato: statoValido });
        carica(); // ricarica i dati
    }

    // Logout
    window.logout = () => {
        auth.signOut().then(() => {
            window.location.href = "login.html";
        });
    };

    // Controllo autenticazione e autorizzazione
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            // Verifica se l'utente è presente nel nodo authoreziedUsers
            const uid = user.uid;
            try {
                const snapshot = await db.ref(`authoreziedUsers/${uid}`).once("value");
                if (snapshot.exists() && snapshot.val() === true) {
                    // Utente autorizzato: mostra la pagina
                    document.getElementById('appScreen').style.display = 'block';
                    carica();
                } else {
                    alert("Accesso non autorizzato. Contattare l'amministratore.");
                    auth.signOut();
                    window.location.href = "login.html";
                }
            } catch (e) {
                console.error("Errore verifica autorizzazione:", e);
                alert("Errore di connessione. Riprova.");
                window.location.href = "login.html";
            }
        } else {
            // Non autenticato: redirect al login
            window.location.href = "login.html";
        }
    });
</script>
</body>
</html>

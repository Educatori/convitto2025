<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cruscotto Operativo — SyncPanel</title>
<link rel="stylesheet" href="css/campus-theme.css">
<link rel="stylesheet" href="css/cruscotto-style.css">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1><a href="index.html">Cruscotto Operativo</a></h1>
            <div id="todayDate" class="header-meta">Caricamento data...</div>
        </div>
        <div id="digitalClock" class="header-clock">00:00:00</div>
        <div class="header-actions">
            <div id="connection-status" class="status-badge connected">🟢 Connesso</div>
            <button onclick="logout()">Logout</button>
        </div>
    </header>

    <!-- Note -->
    <div class="note-toolbar-container">
        <div class="note-content">
            <span class="note-icon">📌</span>
            <textarea id="dailyNotes" placeholder="Inserisci note, promemoria o comunicazioni..." class="note-input" rows="2"></textarea>
            <button class="clear-note-btn" onclick="cancellaNote()" title="Svuota note">✕</button>
        </div>
    </div>

    <div id="info-reset" style="text-align:right;font-size:0.7em;color:var(--absent);margin-top:-10px;margin-bottom:16px;">
        Ultimo aggiornamento: MAI
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
        <button class="btn-toolbar" style="background:var(--accent);" onclick="togglePanel()">P ⚡ PP</button>
        <input type="text" id="search" placeholder="Cerca studente..." onkeyup="applicaFiltri()">
        <div style="display:flex;align-items:center;gap:6px;">
            <span class="room-label">ROOM</span>
            <input type="number" id="roomInput" placeholder="n°" min="101" max="221"
                   onfocus="this.oldValue=this.value;"
                   oninput="gestisciSaltoStanze(this);validaERicerca();">
        </div>
        <button class="btn-reset" onclick="resetDati('soloManuali')" title="Reset Giornaliero">🗑️ Reset Day</button>
        <button class="btn-reset-complete" onclick="resetDati('completo')" title="Reset Completo">⚠️ Reset Full</button>
    </div>

    <!-- Turni -->
    <div style="display:flex;gap:10px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px;">
        <div class="day-box" style="border-bottom:3px solid var(--btn-t1);" onclick="setTurno(1)">1° TURNO (18:30)</div>
        <div class="day-box" style="border-bottom:3px solid var(--btn-t2);" onclick="setTurno(2)">2° TURNO (19:15)</div>
        <div class="day-box" style="border-bottom:3px solid var(--btn-t3);" onclick="generaPopUpStampaConvitto()">STAMPA CONVITTO</div>
        <div class="day-box" style="border-bottom:3px solid var(--btn-t4);" onclick="generaPopUpStampaDinner()">STAMPA DINNER</div>
    </div>

    <div id="listaStudenti"></div>
</div>

<!-- Side Panel -->
<div id="sidePanel" style="position:fixed;top:0;right:-350px;width:320px;height:100%;transition:0.3s;z-index:1000;padding:24px;overflow-y:auto;display:flex;flex-direction:column;background:var(--surface);">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
        <h3 style="margin:0;">Gestione Permessi</h3>
        <button onclick="togglePanel()" style="border:none;background:rgba(255,255,255,0.07);color:var(--text-2);border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:1.2em;">&times;</button>
    </div>
    <hr>
    <h3 style="margin-top:10px;">Programmazione Assenze</h3>
    <select id="selectStudente" style="margin-bottom:8px;"><option value="">-- Seleziona Nome --</option></select>
    <select id="selectClasse" style="margin-bottom:8px;"><option value="">-- Seleziona Classe --</option></select>
    <input type="date" id="dataDal" style="margin-bottom:8px;">
    <input type="date" id="dataAl" style="margin-bottom:12px;">
    <button onclick="aggiungiAssenza()" style="width:100%;background:var(--absent);color:white;border:none;padding:10px;border-radius:var(--radius-sm);cursor:pointer;font-weight:700;">➕ Aggiungi Assenza</button>
    <hr style="margin:20px 0;">
    <h3>Lista Assenze</h3>
    <div id="listaAssenze" style="margin-bottom:20px;"></div>
    <hr>
    <h3>Permessi Permanenti</h3>
    <div id="listaPermessiContent"></div>
</div>

<script type="module">
    import { firebaseConfig } from "./js/firebase-config.js";
    firebase.initializeApp(firebaseConfig);
    import("./js/auth.js");

    // ----------------------------------------------
    // DATI GLOBALI
    // ----------------------------------------------
    const db = firebase.database();
    let studentiData = [];            // array di studenti dal nodo "studenti"
    let permessiData = {};            // nodo "permessi"
    let assenzeProgrammate = {};      // nodo "assenze_programmate"
    let datiLocali = {};              // nodo "dati_cruscotto/YYYY-MM-DD"
    let cambiTurnoManuali = {};       // nodo "cambi_turno/YYYY-MM-DD"
    let currentTurno = 1;
    let currentDate = new Date().toISOString().slice(0,10);

    // ----------------------------------------------
    // CARICAMENTO DATI DA FIREBASE
    // ----------------------------------------------
    async function loadPermessi() {
        const snap = await db.ref("permessi").once("value");
        permessiData = snap.val() || {};
    }
    async function loadStudenti() {
        const snap = await db.ref("studenti").once("value");
        const raw = snap.val();
        studentiData = raw ? Object.values(raw) : [];
    }
    async function loadAssenzeProgrammate() {
        const snap = await db.ref("assenze_programmate").once("value");
        assenzeProgrammate = snap.val() || {};
    }
    async function loadDatiLocali() {
        const snap = await db.ref(`dati_cruscotto/${currentDate}`).once("value");
        datiLocali = snap.val() || {};
    }
    async function loadCambiTurno() {
        const snap = await db.ref(`cambi_turno/${currentDate}`).once("value");
        cambiTurnoManuali = snap.val() || {};
    }
    function saveDatiLocali() {
        db.ref(`dati_cruscotto/${currentDate}`).set(datiLocali);
    }
    function saveCambiTurno() {
        db.ref(`cambi_turno/${currentDate}`).set(cambiTurnoManuali);
    }
    function saveAssenzeProgrammate() {
        db.ref("assenze_programmate").set(assenzeProgrammate);
    }
    function saveNote() {
        const note = document.getElementById('dailyNotes').value;
        db.ref(`note/${currentDate}`).set(note);
    }
    async function loadNote() {
        const snap = await db.ref(`note/${currentDate}`).once("value");
        const note = snap.val() || "";
        document.getElementById('dailyNotes').value = note;
    }

    // ----------------------------------------------
    // UTILITY PER I PERMESSI (da permessiData)
    // ----------------------------------------------
    function getOrariPP(cognome, giorno) {
        return permessiData?.ORARI_PP?.[cognome]?.[giorno] || null;
    }
    function isAssentePermesso(cognome, giorno) {
        return permessiData?.ASSENTI_PERMESSO?.[giorno]?.includes(cognome.toUpperCase()) || false;
    }
    function getTurnoOriginale(classe) {
        return permessiData?.TURNI_DINNER?.[1]?.includes(classe) ? 1 : 2;
    }
    function getOverrideTurno(cognome, giorno) {
        return permessiData?.OVERRIDE_TURNI_DINNER?.[cognome]?.[giorno] || null;
    }
    function isLabOggi(classe, gruppo, data) {
        const giorno = data.getDay();
        const dataKey = data.toLocaleDateString('it-IT');
        const labDinner = permessiData?.LAB_DINNER || [];
        if (labDinner[giorno]?.includes(classe)) return true;
        const cal = permessiData?.CALENDARIO_GRUPPI_DINNER || {};
        if ((classe === "5A" || classe === "5B") && cal[dataKey]) {
            return (cal[dataKey] === "gr1" && gruppo === "G1") || (cal[dataKey] === "gr2" && gruppo === "G2");
        }
        return false;
    }

    // ----------------------------------------------
    // LOGICA TURNI
    // ----------------------------------------------
    function turnoEffettivo(classe, cognome) {
        const oggi = new Date();
        const giorno = oggi.getDay();
        const ovr = getOverrideTurno(cognome, giorno);
        if (ovr) return ovr;
        if (cambiTurnoManuali[cognome]) return getTurnoOriginale(classe) === 1 ? 2 : 1;
        return getTurnoOriginale(classe);
    }

    function setTurno(turno) {
        currentTurno = turno;
        renderLista();
    }
    window.setTurno = setTurno;

    function toggleSwitchTurno(cognome, btn) {
        cambiTurnoManuali[cognome] = !cambiTurnoManuali[cognome];
        btn.classList.toggle('modificato');
        saveCambiTurno();
        renderLista();
    }
    window.toggleSwitchTurno = toggleSwitchTurno;

    // ----------------------------------------------
    // GESTIONE ASSENZE PROGRAMMATE
    // ----------------------------------------------
    function isAssenteProgrammato(cognome, data) {
        const lista = assenzeProgrammate[cognome.toUpperCase()];
        if (!lista) return false;
        const oggi = new Date(data.toISOString().split('T')[0]);
        return lista.some(periodo => {
            const dal = new Date(periodo.dal);
            const al = new Date(periodo.al);
            return oggi >= dal && oggi <= al;
        });
    }

    function aggiungiAssenza() {
        const cognomeSel = document.getElementById('selectStudente').value;
        const classeSel = document.getElementById('selectClasse').value;
        const dal = document.getElementById('dataDal').value;
        const al = document.getElementById('dataAl').value;
        if (!dal || !al) return alert("Seleziona entrambe le date");
        let studentiDaAggiornare = [];
        if (classeSel) {
            studentiDaAggiornare = studentiData.filter(s => s.classe === classeSel).map(s => s.cognome.toUpperCase());
        } else if (cognomeSel) {
            studentiDaAggiornare = [cognomeSel.toUpperCase()];
        } else {
            return alert("Seleziona uno studente o una classe");
        }
        studentiDaAggiornare.forEach(cognome => {
            if (!assenzeProgrammate[cognome]) assenzeProgrammate[cognome] = [];
            assenzeProgrammate[cognome].push({ dal, al });
        });
        saveAssenzeProgrammate();
        renderListaAssenze();
        renderLista(); // aggiorna la visualizzazione
    }
    window.aggiungiAssenza = aggiungiAssenza;

    function rimuoviAssenza(cognome, index) {
        assenzeProgrammate[cognome].splice(index, 1);
        if (assenzeProgrammate[cognome].length === 0) delete assenzeProgrammate[cognome];
        saveAssenzeProgrammate();
        renderListaAssenze();
        renderLista();
    }
    window.rimuoviAssenza = rimuoviAssenza;

    function renderListaAssenze() {
        const container = document.getElementById('listaAssenze');
        if (!container) return;
        container.innerHTML = Object.entries(assenzeProgrammate).map(([cognome, periodi]) => `
            <div style="margin-bottom:10px;">
                <b>${cognome}</b>
                ${periodi.map((p, i) => `
                    <div style="font-size:0.8em;">
                        ${p.dal} → ${p.al}
                        <button onclick="rimuoviAssenza('${cognome}', ${i})">❌</button>
                    </div>
                `).join('')}
            </div>
        `).join('');
    }

    // ----------------------------------------------
    // GESTIONE DINNER AUTOMATICO (checkbox NON CENA)
    // ----------------------------------------------
    function controllaDinnerAutomatico(div, s, idKey) {
        const dati = datiLocali[idKey] || {};
        const entra = dati.entra || "";
        const ppIn = getOrariPP(s.cognome, new Date().getDay())?.in || "";
        const limite = getTurnoOriginale(s.classe) === 1 ? "18:30" : "19:15";
        const paroleNo = ["n","no","non","nor","no rientro","x"];
        const isNoRientro = (o) => paroleNo.includes(o.toLowerCase().trim());
        const isTardi = (o) => o.includes(":") && o > limite;
        const assente = dati.assente;
        const isNo = isNoRientro(entra) || isNoRientro(ppIn) || isTardi(entra) || isTardi(ppIn);
        if (assente || isNo) {
            dati.dinnerno = "1";
            div.querySelector('.btn-din')?.classList.add('active-din');
        } else {
            if (dati.dinnerno !== "1") dati.dinnerno = "0";
            div.querySelector('.btn-din')?.classList.remove('active-din');
        }
        datiLocali[idKey] = dati;
        saveDatiLocali();
    }

    // ----------------------------------------------
    // RENDER DELLA LISTA STUDENTI
    // ----------------------------------------------
    function renderLista() {
        const container = document.getElementById('listaStudenti');
        if (!container) return;
        container.innerHTML = "";
        const oggi = new Date();
        const giornoSett = oggi.getDay();

        studentiData.sort((a,b) => (a.room || "").localeCompare(b.room || "", undefined, { numeric:true })).forEach(s => {
            if (!s.cognome) return;
            const idKey = `${s.cognome}_${s.nome}`.replace(/[^a-zA-Z0-9_-]/g, '_');
            const dati = datiLocali[idKey] || { esce: "", entra: "", assente: false, dinnerno: "0" };
            const turnoEff = turnoEffettivo(s.classe, s.cognome);
            if (currentTurno !== turnoEff) return; // salta righe non del turno selezionato

            const isLab = isLabOggi(s.classe, s.gruppo, oggi);
            const isAssProg = isAssenteProgrammato(s.cognome, oggi);
            const isPPNoCena = isAssentePermesso(s.cognome, giornoSett);

            const div = document.createElement('div');
            div.className = 'student-row';
            if (isLab) div.classList.add('highlight-lab');
            if (isAssProg || dati.assente) div.classList.add('assente');
            if (dati.dinnerno === "1" || isPPNoCena) div.classList.add('dinner-no');

            div.dataset.cognome = s.cognome;
            div.dataset.classe = s.classe;
            div.dataset.room = s.room;
            div.innerHTML = `
                <div class="st-header">
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span class="room-badge">room ${s.room}</span>
                        <button class="btn-switch ${cambiTurnoManuali[s.cognome] ? 'modificato' : ''}" onclick="toggleSwitchTurno('${s.cognome}', this)">⇄</button>
                    </div>
                    <span style="font-size:0.75em; color:#666; font-weight:bold;">
                        ${s.classe} ${s.percorso || ''} ${s.gruppo || ''} ${isLab ? '<span class="lab-badge">LAB</span>' : ''}
                    </span>
                </div>
                <b style="font-size:1.1em">${s.cognome}</b> ${s.nome}
                <div class="inputs">
                    <input type="text" placeholder="ESCE" class="in-u" value="${dati.esce || ''}">
                    <input type="text" placeholder="ENTRA" class="in-i" value="${dati.entra || ''}">
                </div>
                <div class="btns">
                    <button class="btn-ass ${dati.assente ? 'active-ass' : ''}">ASSENTE</button>
                    <button class="btn-din ${dati.dinnerno === '1' ? 'active-din' : ''}">NON CENA</button>
                </div>
            `;

            const inU = div.querySelector('.in-u');
            const inI = div.querySelector('.in-i');
            const btnAss = div.querySelector('.btn-ass');
            const btnDin = div.querySelector('.btn-din');

            inU.addEventListener('change', () => {
                dati.esce = inU.value;
                datiLocali[idKey] = dati;
                saveDatiLocali();
            });
            inI.addEventListener('change', () => {
                dati.entra = inI.value;
                datiLocali[idKey] = dati;
                saveDatiLocali();
                controllaDinnerAutomatico(div, s, idKey);
            });
            btnAss.addEventListener('click', () => {
                dati.assente = !dati.assente;
                datiLocali[idKey] = dati;
                btnAss.classList.toggle('active-ass');
                if (dati.assente) div.classList.add('assente');
                else div.classList.remove('assente');
                controllaDinnerAutomatico(div, s, idKey);
                saveDatiLocali();
            });
            btnDin.addEventListener('click', () => {
                dati.dinnerno = dati.dinnerno === '1' ? '0' : '1';
                datiLocali[idKey] = dati;
                btnDin.classList.toggle('active-din');
                if (dati.dinnerno === '1') div.classList.add('dinner-no');
                else div.classList.remove('dinner-no');
                saveDatiLocali();
            });

            container.appendChild(div);
            controllaDinnerAutomatico(div, s, idKey);
        });
    }

    // ----------------------------------------------
    // FILTRI E RICERCA
    // ----------------------------------------------
    function applicaFiltri() {
        const search = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.student-row').forEach(row => {
            const testo = (row.dataset.cognome + " " + row.dataset.classe + " " + row.dataset.room).toLowerCase();
            row.style.display = testo.includes(search) ? '' : 'none';
        });
    }
    window.applicaFiltri = applicaFiltri;

    function validaERicerca() {
        const roomVal = document.getElementById('roomInput').value;
        const searchInput = document.getElementById('search');
        if (roomVal !== "") {
            searchInput.value = "";
            document.querySelectorAll('.student-row').forEach(row => {
                row.style.display = row.dataset.room === roomVal ? '' : 'none';
            });
        } else {
            applicaFiltri();
        }
    }
    window.validaERicerca = validaERicerca;

    function gestisciSaltoStanze(el) {
        let val = parseInt(el.value);
        let old = parseInt(el.oldValue) || 0;
        if (val > 125 && val < 201 && val > old) el.value = 201;
        else if (val > 125 && val < 201 && val < old) el.value = 125;
        el.oldValue = el.value;
    }
    window.gestisciSaltoStanze = gestisciSaltoStanze;

    // ----------------------------------------------
    // RESET DATI
    // ----------------------------------------------
    function resetDati(tipo) {
        if (tipo === 'soloManuali') {
            if (confirm("⚠️ Reset giornaliero: cancella tutti i dati di uscita/rientro, assenze e non cena di OGGI. Continuare?")) {
                datiLocali = {};
                cambiTurnoManuali = {};
                saveDatiLocali();
                saveCambiTurno();
                localStorage.setItem('dataUltimoReset', new Date().toLocaleString('it-IT'));
                renderLista();
                document.getElementById('info-reset').innerText = `Ultimo aggiornamento: ${localStorage.getItem('dataUltimoReset')}`;
            }
        } else if (tipo === 'completo') {
            if (confirm("⚠️ RESET COMPLETO: cancella TUTTI i dati (assenze programmate, turni manuali, dati giornalieri) per OGNI data. Azione irreversibile. Sei sicuro?")) {
                db.ref("dati_cruscotto").remove();
                db.ref("cambi_turno").remove();
                db.ref("assenze_programmate").remove();
                datiLocali = {};
                cambiTurnoManuali = {};
                assenzeProgrammate = {};
                saveDatiLocali();
                saveCambiTurno();
                saveAssenzeProgrammate();
                localStorage.setItem('dataUltimoReset', new Date().toLocaleString('it-IT'));
                renderLista();
                renderListaAssenze();
                document.getElementById('info-reset').innerText = `Ultimo aggiornamento: ${localStorage.getItem('dataUltimoReset')}`;
            }
        }
    }
    window.resetDati = resetDati;

    // ----------------------------------------------
    // STAMPA DINNER (popup)
    // ----------------------------------------------
    function generaPopUpStampaDinner() {
        let a1=0, p1=0, a2=0, p2=0, n1=[], n2=[], switch1=[], switch2=[];
        const oggi = new Date();
        const giornoSett = oggi.getDay();
        const oraEsatta = oggi.toLocaleTimeString('it-IT', { hour:'2-digit', minute:'2-digit' });
        const dataOggi = oggi.toLocaleDateString('it-IT');
        const dataTestuale = document.getElementById('todayDate').innerText;

        studentiData.forEach(s => {
            if (!s.cognome) return;
            const idKey = `${s.cognome}_${s.nome}`.replace(/[^a-zA-Z0-9_-]/g, '_');
            const dati = datiLocali[idKey] || {};
            const turnoOrig = getTurnoOriginale(s.classe);
            let turnoEff = turnoEffettivo(s.classe, s.cognome);
            const nomeCompleto = `${s.cognome} ${s.nome}`;
            if (turnoEff !== turnoOrig) {
                const nota = (turnoEff === 1) ? " (da 2° a 1°)" : " (da 1° a 2°)";
                if (turnoEff === 1) switch1.push(nomeCompleto + nota);
                else switch2.push(nomeCompleto + nota);
            }
            const isLab = isLabOggi(s.classe, s.gruppo, oggi);
            const isPPNoCena = isAssentePermesso(s.cognome, giornoSett);
            const assenteProg = isAssenteProgrammato(s.cognome, oggi);
            const escluso = isLab || isPPNoCena || assenteProg || dati.assente || dati.dinnerno === "1";
            if (turnoEff === 1) {
                if (escluso) { a1++; n1.push(nomeCompleto + (isLab ? " (LAB)" : "")); }
                else p1++;
            } else {
                if (escluso) { a2++; n2.push(nomeCompleto + (isLab ? " (LAB)" : "")); }
                else p2++;
            }
        });

        const testiPermessi = {
            1: "LAB 2IeFP - PERMESSI: Tessarin NO dinner / Casalicchio turno ore 18 / Bombonato, Paonessa turno ore 19:15 / TENERE PER Querio, Pignatelli, Menaldino, Chessa dopo i turni",
            2: "LAB 5A-5B - PERMESSI: Chen, Commod NO dinner / Casalicchio, Clerin turno ore 18 / TENERE PER Querio, Lazier, Lunardi, Paonessa, Gaspard dopo i turni",
            3: "LAB 2B - PERMESSI: Berruti S, D'Agostino, Giovannelli P NO dinner / Casalicchio dinner ore 18 / Saitta, Bombonato, Paonessa turno ore 19:15 / TENERE PER Querio, Pignatelli, Chessa dopo i turni",
            4: "LAB 2A - PERMESSI: Berruti A, Chen NO dinner / Casalicchio, Clerin turno ore 18 / Bombonato, Paonessa turno ore 19:15 / TENERE PER Querio, Menaldino, Chessa dopo i turni"
        };
        const notaGiornoCorrente = testiPermessi[giornoSett] || "";

        const popup = window.open('', '_blank', 'width=900,height=800');
        popup.document.write(`
            <html><head><title>Riepilogo Dinner - ${dataTestuale}</title>
            <style>
                body { font-family: sans-serif; padding: 40px; position: relative; }
                h2 { text-align: center; text-transform: uppercase; margin-top: 20px; }
                .timestamp { position: absolute; top: 10px; right: 20px; font-size: 0.8em; color: #666; }
                .date { text-align: center; font-size: 1.2em; margin-bottom: 20px;}
                .editable-notes { width: 100%; border: 1px dashed #ccc; font-size: 1.1em; font-weight: bold; text-align: center; text-transform: uppercase; padding: 10px; margin-bottom: 20px;}
                .section { margin-bottom: 30px; border-left: 6px solid #333; padding-left: 20px; }
                .stats-row { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
                input { font-size: 1.5em; font-weight: bold; width: 60px; border: none; border-bottom: 2px solid #000; text-align: center; background: transparent; }
                .nomi, .cambi { font-size: 0.85em; color: #444; font-style: italic; margin-top: 10px; line-height: 1.4; }
                .no-print { margin-top: 30px; display: flex; justify-content: center; }
                @media print { .no-print { display: none; } .editable-notes { border: none; } }
            </style>
            </head><body>
            <div class="timestamp">aggiornamento ${dataOggi} ore ${oraEsatta}</div>
            <h2>Riepilogo Dinner</h2>
            <div class="date">${dataTestuale}</div>
            <div class="no-print"><button onclick="window.print()" style="padding:15px 50px; background:#27ae60; color:white; font-weight:bold; border-radius:80px; border:none; cursor:pointer;">STAMPARE IN FORMATO A4</button></div>
            <textarea class="editable-notes" rows="2">${notaGiornoCorrente}</textarea>
            <div class="section">
                <h3>1° DINNER ore 18:30</h3>
                <div class="stats-row"><span>Assenti: <input type="number" value="${a1}"></span><span>Presenti: <input type="number" value="${p1}"></span><span>+ EDU: <input type="number" value="2"></span></div>
                <div class="nomi"><b>Esclusi:</b> ${n1.length ? n1.join(', ') : 'Nessuno'}</div>
                <div class="cambi"><b>Cambi Turno:</b> ${switch1.length ? switch1.join(', ') : 'Nessuno'}</div>
            </div>
            <div class="section">
                <h3>2° DINNER ore 19:15</h3>
                <div class="stats-row"><span>Assenti: <input type="number" value="${a2}"></span><span>Presenti: <input type="number" value="${p2}"></span><span>+ EDU: <input type="number" value="2"></span></div>
                <div class="nomi"><b>Esclusi:</b> ${n2.length ? n2.join(', ') : 'Nessuno'}</div>
                <div class="cambi"><b>Cambi Turno:</b> ${switch2.length ? switch2.join(', ') : 'Nessuno'}</div>
            </div>
            </body></html>
        `);
        popup.document.close();
    }
    window.generaPopUpStampaDinner = generaPopUpStampaDinner;

    // ----------------------------------------------
    // STAMPA CONVITTO (popup)
    // ----------------------------------------------
    function generaPopUpStampaConvitto() {
        const dataStampa = document.getElementById('todayDate').innerText;
        const oraStampa = new Date().toLocaleTimeString('it-IT', { hour:'2-digit', minute:'2-digit' });
        const dataOggiStampa = new Date().toLocaleDateString('it-IT');
        const giornoSettimana = new Date().getDay();
        const camere = {};

        studentiData.forEach(s => {
            if (!s.cognome || !s.room) return;
            const room = s.room;
            const idKey = `${s.cognome}_${s.nome}`.replace(/[^a-zA-Z0-9_-]/g, '_');
            const dati = datiLocali[idKey] || {};
            let ppOut = "", ppIn = "";
            const orari = getOrariPP(s.cognome, giornoSettimana);
            if (orari) { ppOut = orari.out; ppIn = orari.in; }
            const assenteProg = isAssenteProgrammato(s.cognome, new Date());
            const presente = !dati.assente && !assenteProg;
            if (!camere[room]) camere[room] = [];
            camere[room].push({
                classe: s.classe, percorso: s.percorso || "", cognome: s.cognome,
                dinnerno: dati.dinnerno, presente: presente,
                oraU: dati.esce || "", oraI: dati.entra || "",
                ppOut: ppOut, ppIn: ppIn, gruppo: s.gruppo || "",
                bus: (() => { const cls = s.classe.toUpperCase(); return !["2A","2B"].includes(cls) && !cls.includes("P"); })()
            });
        });

        const camereOrdinate = Object.keys(camere).sort((a,b) => parseInt(a) - parseInt(b));
        const popup = window.open('', '_blank', 'width=1200,height=800');
        popup.document.write(`
            <html><head><title>Riepilogo Convitto - ${dataStampa}</title>
            <style>
                @page { size: A3 portrait; margin: 0.3cm; }
                body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; color: #000; }
                h2 { text-align: center; text-transform: uppercase; font-size: 1.1em; margin: 6px 0; }
                table { width: 100%; border-collapse: collapse; table-layout: fixed; margin-bottom: 10px; }
                th, td { border: 1px solid #000; padding: 4px 2px; text-align: center; font-size: 0.62em; overflow: hidden; }
                th { background: #f2f2f2; font-weight: bold; }
                .room-header { background: #eee; font-weight: bold; width: 45px; }
                .border-bottom-bold { border-bottom: 2.5px solid #000 !important; }
                .border-dashed { border-bottom: 1px dashed #999 !important; }
                .col-cognome { text-align: center; width: 130px; text-transform: uppercase; }
                .bg-gray { background: #f9f9f9; }
                .page-break { page-break-after: always; }
                .footer-timestamp { text-align: right; font-size: 0.75em; margin-top: 15px; font-style: italic; color: #555; }
                .no-print { text-align: center; margin: 20px; }
                @media print { .no-print { display: none; } }
            </style>
            </head><body>
            <div class="no-print"><button onclick="window.print()" style="padding:15px 50px; background:#27ae60; color:white; font-weight:bold; border-radius:80px; border:none; cursor:pointer;">STAMPARE IN FORMATO A3</button></div>
            <h2>MASCHILE - piano 1° - ${dataStampa}</h2>
            <table><thead><tr><th>Room</th><th>Classe</th><th class="col-cognome">Cognome</th><th>Presente</th><th>Assente</th><th>Uscita</th><th>Ingresso</th><th>PP Uscita</th><th>PP Rientro</th><th>Dinner NO</th><th>Notte SI</th><th>Notte NO</th><th>7:30</th></tr></thead><tbody>
            ${camereOrdinate.map(room => {
                let html = "";
                html += camere[room].map((s, idx) => {
                    const isLastRow = idx === camere[room].length - 1;
                    const bClass = isLastRow ? 'class="border-bottom-bold"' : 'class="border-dashed"';
                    const bClassGray = isLastRow ? 'class="border-bottom-bold bg-gray"' : 'class="border-dashed bg-gray"';
                    return `<tr>
                        ${idx === 0 ? `<td rowspan="${camere[room].length}" class="room-header border-bottom-bold">${room}</td>` : ''}
                        <td ${bClass}>${s.classe} ${s.percorso}</td>
                        <td ${bClass} class="col-cognome"><b>${s.cognome}</b> ${s.gruppo ? '('+s.gruppo+')' : ''}</td>
                        <td ${bClass}>${s.presente ? 'X' : ''}</td><td ${bClass}>${!s.presente ? 'X' : ''}</td>
                        <td ${bClassGray}>${s.oraU}</td><td ${bClass}>${s.oraI}</td>
                        <td ${bClassGray}><b>${s.ppOut}</b></td><td ${bClass}><b>${s.ppIn}</b></td>
                        <td ${bClassGray}>${s.dinnerno === "1" ? "X" : ""}</td><td ${bClass}></td><td ${bClassGray}></td>
                        <td ${bClass}>${s.bus ? '⭕' : ''}</td>
                    </tr>`;
                }).join('');
                if (room === "125") {
                    html += `</tbody></table><div class="page-break"></div><h2>FEMMINILE - piano 2° - ${dataStampa}</h2><table><thead><tr><th>Room</th><th>Classe</th><th class="col-cognome">Cognome</th><th>Presente</th><th>Assente</th><th>Uscita</th><th>Ingresso</th><th>PP Uscita</th><th>PP Rientro</th><th>Dinner NO</th><th>Notte SI</th><th>Notte NO</th><th>7:30</th></tr></thead><tbody>`;
                }
                return html;
            }).join('')}
            </tbody></table>
            <div class="footer-timestamp">aggiornamento ${dataOggiStampa} ore ${oraStampa}</div>
            </body></html>
        `);
        popup.document.close();
    }
    window.generaPopUpStampaConvitto = generaPopUpStampaConvitto;

    // ----------------------------------------------
    // PANNELLO LATERALE (PERMESSI E ASSENZE)
    // ----------------------------------------------
    function popolaListaPermessi() {
        const container = document.getElementById('listaPermessiContent');
        const giorniSettimana = ["", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì"];
        const studentiPP = Object.keys(permessiData?.ORARI_PP || {}).sort();
        if (studentiPP.length === 0) { container.innerHTML = "<p>Nessun orario PP.</p>"; return; }
        container.innerHTML = studentiPP.map(cognome => {
            const orari = permessiData.ORARI_PP[cognome];
            let dettagli = Object.keys(orari).map(g => `<div style="font-size:0.8em; margin-left:10px;"><b>${giorniSettimana[g].substring(0,2)}:</b> ${orari[g].out} > ${orari[g].in}</div>`).join('');
            return `<div style="margin-bottom:12px; border-bottom:1px solid #eee;"><b>${cognome}</b>${dettagli}</div>`;
        }).join('');
    }

    function popolaSelectStudenti() {
        const sel = document.getElementById('selectStudente');
        if (!sel) return;
        const gruppi = {};
        studentiData.forEach(s => { if (!gruppi[s.classe]) gruppi[s.classe] = []; gruppi[s.classe].push(s); });
        let html = `<option value="">-- Seleziona Nome --</option>`;
        Object.keys(gruppi).sort().forEach(classe => {
            html += `<optgroup label="${classe}">`;
            gruppi[classe].forEach(s => { html += `<option value="${s.cognome}">${s.cognome} ${s.nome}</option>`; });
            html += `</optgroup>`;
        });
        sel.innerHTML = html;
    }

    function popolaSelectClassi() {
        const sel = document.getElementById('selectClasse');
        if (!sel) return;
        const classi = [...new Set(studentiData.map(s => s.classe))].sort();
        sel.innerHTML = `<option value="">-- Seleziona Classe --</option>` + classi.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function togglePanel() {
        const panel = document.getElementById('sidePanel');
        if (panel.style.right === "0px") {
            panel.style.right = "-350px";
        } else {
            popolaListaPermessi();
            popolaSelectStudenti();
            renderListaAssenze();
            popolaSelectClassi();
            panel.style.right = "0px";
        }
    }
    window.togglePanel = togglePanel;

    // ----------------------------------------------
    // NOTE E OROLOGIO
    // ----------------------------------------------
    function cancellaNote() {
        if (confirm("Cancellare definitivamente le note?")) {
            document.getElementById('dailyNotes').value = "";
            saveNote();
        }
    }
    window.cancellaNote = cancellaNote;

    function updateClock() {
        document.getElementById('digitalClock').innerText = new Date().toLocaleTimeString('it-IT');
    }

    function mostraDataReset() {
        const d = localStorage.getItem('dataUltimoReset');
        if (d) document.getElementById('info-reset').innerText = `Ultimo aggiornamento: ${d}`;
    }

    // ----------------------------------------------
    // INIZIALIZZAZIONE
    // ----------------------------------------------
    async function init() {
        await Promise.all([loadPermessi(), loadStudenti(), loadAssenzeProgrammate(), loadDatiLocali(), loadCambiTurno(), loadNote()]);
        document.getElementById('todayDate').innerText = new Date().toLocaleDateString('it-IT', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
        updateClock();
        setInterval(updateClock, 1000);
        renderLista();
        renderListaAssenze();
        mostraDataReset();
        // Salvataggio automatico note
        const noteTA = document.getElementById('dailyNotes');
        noteTA.addEventListener('input', () => saveNote());
    }

    window.logout = () => { firebase.auth().signOut().then(() => location.reload()); };

    document.addEventListener("authReady", init);
</script>
</body>
</html>

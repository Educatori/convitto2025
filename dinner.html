<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presenze Dinner — Turni 18:30 e 19:15</title>
    <link rel="stylesheet" href="css/campus-theme.css">
    <link rel="stylesheet" href="css/dinner-style.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>
<div class="no-print">
    <button class="btn" onclick="window.print()">STAMPA FRONTE-RETRO</button>
</div>

<!-- TURNO 1 (FRONTE) -->
<div class="turno-container turno-1">
    <div class="header-main">
        <img src="assets/Logo.png" alt="Logo" class="print-logo">
        <h1><a href="index.html">Presenze Dinner</a></h1>
        <p class="subtitle">Turno 18:30</p>
    </div>
    <div class="grid-wrapper" id="turno1-wrapper"></div>
</div>

<!-- TURNO 2 (RETRO) -->
<div class="turno-container turno-2">
    <div class="header-main">
        <img src="assets/Logo.png" alt="Logo" class="print-logo">
        <h1>Presenze Dinner</h1>
        <p class="subtitle">Turno 19:15</p>
    </div>
    <div class="grid-wrapper" id="turno2-wrapper"></div>
</div>

<script type="module">
    import { firebaseConfig } from "./js/firebase-config.js";
    firebase.initializeApp(firebaseConfig);
    import("./js/auth.js");

    const db = firebase.database();
    let studentiData = [];
    let presenzeMap = {};   // { studenteId: [lu, ma, me, gi] }
    const weekKey = (() => { const now = new Date(); return `${now.getFullYear()}-W${Math.ceil((now - new Date(now.getFullYear(),0,1)) / 86400000 / 7)}`; })();

    async function loadData() {
        const snapStud = await db.ref("studenti").once("value");
        const raw = snapStud.val();
        studentiData = raw ? Object.values(raw).filter(s => s.cognome && s.classe) : [];
        const snapPres = await db.ref(`presenze_settimanali_dinner/${weekKey}`).once("value");
        presenzeMap = snapPres.val() || {};
        render();
    }

    function savePresenza(studId, giornoIdx, checked) {
        if (!presenzeMap[studId]) presenzeMap[studId] = [false, false, false, false];
        presenzeMap[studId][giornoIdx] = checked;
        db.ref(`presenze_settimanali_dinner/${weekKey}/${studId}`).set(presenzeMap[studId]);
    }

    function creaColonna(studenti, turnoNum) {
        const colonnaDiv = document.createElement('div');
        colonnaDiv.className = 'column';
        colonnaDiv.innerHTML = `<div class="column-header"><div class="cell-class">Classe</div><div class="cell-name">Nome</div><div class="cell-check">LU</div><div class="cell-check">MA</div><div class="cell-check">ME</div><div class="cell-check">GI</div></div>`;
        studenti.forEach(s => {
            const row = document.createElement('div');
            row.className = 'student-row';
            const infoClasse = `${s.classe} ${s.percorso || ''} ${s.gruppo ? '• '+s.gruppo : ''}`;
            row.innerHTML = `
                <div class="cell-class">${infoClasse}</div>
                <div class="cell-name" style="cursor:pointer"><b>${s.cognome}</b> ${s.nome}</div>
                <div class="cell-check"><input type="checkbox" class="chk0"></div>
                <div class="cell-check"><input type="checkbox" class="chk1"></div>
                <div class="cell-check"><input type="checkbox" class="chk2"></div>
                <div class="cell-check"><input type="checkbox" class="chk3"></div>
            `;
            const studId = `${s.cognome}_${s.nome}`.replace(/[^a-zA-Z0-9_-]/g, '_');
            const pres = presenzeMap[studId] || [false, false, false, false];
            for (let i=0; i<4; i++) {
                const chk = row.querySelector(`.chk${i}`);
                chk.checked = pres[i];
                chk.addEventListener('change', (e) => { e.stopPropagation(); savePresenza(studId, i, chk.checked); });
            }
            row.querySelector('.cell-name').addEventListener('click', () => row.classList.toggle('row-crossed'));
            colonnaDiv.appendChild(row);
        });
        return colonnaDiv;
    }

    function distribuisciInColonne(studenti, numColonne) {
        const colonne = Array(numColonne).fill().map(() => []);
        const perCol = Math.ceil(studenti.length / numColonne);
        studenti.forEach((s, idx) => { colonne[Math.floor(idx / perCol)].push(s); });
        return colonne;
    }

    function render() {
        const turno1 = studentiData.filter(s => {
            const cls = s.classe.toUpperCase();
            return (cls.startsWith('1') || cls.startsWith('2') || cls === '3P');
        });
        const turno2 = studentiData.filter(s => {
            const cls = s.classe.toUpperCase();
            return (cls.startsWith('3') || cls.startsWith('4') || cls.startsWith('5')) && cls !== '3P';
        });
        turno1.sort((a,b) => a.cognome.localeCompare(b.cognome));
        turno2.sort((a,b) => a.cognome.localeCompare(b.cognome));

        const wrapper1 = document.getElementById('turno1-wrapper');
        const wrapper2 = document.getElementById('turno2-wrapper');
        wrapper1.innerHTML = '';
        wrapper2.innerHTML = '';

        const numCol1 = Math.min(3, Math.ceil(turno1.length / 12) || 1);
        const numCol2 = Math.min(3, Math.ceil(turno2.length / 12) || 1);
        wrapper1.style.gridTemplateColumns = `repeat(${numCol1}, 1fr)`;
        wrapper2.style.gridTemplateColumns = `repeat(${numCol2}, 1fr)`;

        distribuisciInColonne(turno1, numCol1).forEach(col => wrapper1.appendChild(creaColonna(col, 1)));
        distribuisciInColonne(turno2, numCol2).forEach(col => wrapper2.appendChild(creaColonna(col, 2)));
    }

    document.addEventListener("authReady", loadData);
</script>
</body>
</html>

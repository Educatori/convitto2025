<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accesso — Campus 2025</title>
    <link rel="stylesheet" href="css/campus-theme.css">
    <style>
        /* stesso stile che avevi */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg);
            padding: 24px;
        }
        .login-card {
            background: var(--surface);
            border: 1px solid var(--border-2);
            border-radius: var(--radius-xl);
            padding: 40px 36px;
            width: 100%;
            max-width: 360px;
            box-shadow: var(--shadow-lg);
            text-align: center;
        }
        .login-logo { width: 64px; margin-bottom: 16px; }
        .login-title { font-size: 1.1rem; font-weight: 700; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
        .login-sub { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 28px; }
        .field { margin-bottom: 14px; text-align: left; }
        .field label { display: block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: var(--text-2); margin-bottom: 6px; }
        .field input { width: 100%; padding: 11px 14px; background: var(--bg-3); border: 1px solid var(--border-2); border-radius: var(--radius); color: var(--text); font-size: 0.88rem; box-sizing: border-box; }
        .btn-login { width: 100%; padding: 13px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: var(--text-inv); border: none; border-radius: var(--radius); font-weight: 700; cursor: pointer; }
        .error-msg { margin-top: 14px; padding: 10px; background: var(--absent-dim); border-radius: var(--radius-sm); color: var(--absent); display: none; }
        .error-msg.visible { display: block; }
    </style>
</head>
<body>
<div class="login-card">
    <img src="assets/Logo.png" alt="Logo" class="login-logo">
    <div class="login-title">Campus 25-26</div>
    <div class="login-sub">Accesso riservato al personale autorizzato</div>
    <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="nome@esempio.it">
    </div>
    <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••">
    </div>
    <button class="btn-login" onclick="doLogin()">ACCEDI</button>
    <div id="errorMsg" class="error-msg"></div>
    <div class="login-footer">Accesso protetto · Solo utenti autorizzati</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { firebaseConfig } from "./js/firebase-config.js";
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    window.doLogin = async () => {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const btn = document.querySelector(".btn-login");
        const errDiv = document.getElementById("errorMsg");
        if (!email || !password) { errDiv.textContent = "Inserisci email e password."; errDiv.classList.add("visible"); return; }
        errDiv.classList.remove("visible");
        btn.disabled = true; btn.textContent = "Accesso in corso…";
        try {
            await signInWithEmailAndPassword(auth, email, password);
            const urlParams = new URLSearchParams(window.location.search);
            const redirect = urlParams.get("redirect") || "index.html";
            window.location.href = redirect;
        } catch (e) {
            btn.disabled = false; btn.textContent = "ACCEDI";
            let msg = "Credenziali non valide.";
            if (e.code === "auth/user-not-found") msg = "Utente non trovato.";
            if (e.code === "auth/wrong-password") msg = "Password errata.";
            errDiv.textContent = msg; errDiv.classList.add("visible");
        }
    };
    document.getElementById("password").addEventListener("keydown", (e) => { if (e.key === "Enter") window.doLogin(); });
</script>
</body>
</html>

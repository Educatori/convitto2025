<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Presenze Dinner</title>
    <link rel="stylesheet" href="css/presenze-dinner.css">
</head>
<body>

<div class="no-print">
    <button class="btn" onclick="window.print()">STAMPA</button>
</div>

<div class="header-main">
    <h1>Presenze Dinner</h1>
</div>

<div class="dinner-wrapper">

    <!-- TURNO 1 -->
    <div class="macro-column">
        <div class="turn-title">TURNO 1</div>

        <div class="column-header">
            <div class="cell-class">Classe</div>
            <div class="cell-name">Nome</div>
            <div class="cell-check">LU</div>
            <div class="cell-check">MA</div>
            <div class="cell-check">ME</div>
            <div class="cell-check">GI</div>
        </div>

        <div id="turno1"></div>
    </div>

    <!-- TURNO 2 -->
    <div class="macro-column">
        <div class="turn-title">TURNO 2</div>

        <div class="column-header">
            <div class="cell-class">Classe</div>
            <div class="cell-name">Nome</div>
            <div class="cell-check">LU</div>
            <div class="cell-check">MA</div>
            <div class="cell-check">ME</div>
            <div class="cell-check">GI</div>
        </div>

        <div id="turno2"></div>
    </div>

</div>

<script src="js/studenti_25-26.js"></script>
<script src="js/convittori.js"></script>
<script src="js/presenze-dinner.js"></script>

</body>
</html>

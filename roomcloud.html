<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Room Cloud 4.0</title>
    <link rel="stylesheet" href="css/campus-theme.css">
    <style>/* stile come nell'originale, lo omettiamo per brevità */</style>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>
<div id="appScreen">
    <div class="app-header"><h1><a href="index.html">Room Cloud 3.0</a></h1><button onclick="logout()">Esci</button></div>
    <div id="roomsGrid" class="rooms-grid"></div>
</div>
<script type="module">
    import { firebaseConfig } from "./js/firebase-config.js";
    firebase.initializeApp(firebaseConfig);
    import("./js/auth.js");
    const db = firebase.database();
    let studenti = [];
    let stati = {};

    async function carica() {
        const snapStud = await db.ref("studenti").once("value");
        const raw = snapStud.val();
        studenti = raw ? Object.values(raw).filter(s => s.room && s.cognome) : [];
        const snapStati = await db.ref("roomcloud_stati").once("value");
        stati = snapStati.val() || {};
        render();
    }
    function render() {
        const stanze = {};
        studenti.forEach(s => { if (!stanze[s.room]) stanze[s.room] = []; stanze[s.room].push(s); });
        const grid = document.getElementById('roomsGrid');
        grid.innerHTML = "";
        Object.keys(stanze).sort((a,b)=>parseInt(a)-parseInt(b)).forEach(room => {
            const card = document.createElement('div'); card.className='room-card';
            card.innerHTML = `<div class="room-title">${room}</div><div class="students-list"></div>`;
            const list = card.querySelector('.students-list');
            stanze[room].forEach(s => {
                const id = `${s.cognome}_${s.nome}`.replace(/[^a-zA-Z0-9_-]/g,'_');
                const stato = stati[id] || {};
                const div = document.createElement('div'); div.className='student-item';
                div.innerHTML = `<div class="student-name">${s.cognome} ${s.nome}</div><div class="student-class">${s.classe}</div>`;
                if (stato.stato === 'assente') div.classList.add('stato-assente');
                else if (stato.stato === 'confermato') div.classList.add('stato-confermato');
                else if (stato.stato === 'attivita') div.classList.add('stato-attivita');
                div.onclick = () => sceltaStato(id);
                list.appendChild(div);
            });
            grid.appendChild(card);
        });
    }
    async function sceltaStato(id) {
        const scelta = prompt("Stato: standby, assente, attivita (o annulla)");
        if (!scelta) return;
        await db.ref(`roomcloud_stati/${id}`).set({ stato: scelta });
        carica();
    }
    window.logout = () => { firebase.auth().signOut().then(()=>location.reload()); };
    document.addEventListener("authReady", carica);
</script>
</body>
</html>

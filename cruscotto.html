<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cruscotto SYNC - Convitto e Dinner</title>
    
    <link rel="stylesheet" href="css/cruscotto-style.css">
    
    <!-- Firebase SDK -->
   <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body>
    
<!-- login -->
    
    <div id="loginScreen" style="
    position:fixed;
    inset:0;
    background:#f5f5f5;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:99999;
">

   <div style="
        background:white;
        padding:40px;
        border-radius:20px;
        box-shadow:0 10px 30px rgba(0,0,0,0.15);
        width:320px;
        text-align:center;
    ">

        <h2 style="margin-bottom:25px;">Accesso Cruscotto</h2>

        <input 
            type="email" 
            id="loginEmail"
            placeholder="Email"
            style="
                width:100%;
                padding:12px;
                margin-bottom:15px;
                border:1px solid #ccc;
                border-radius:10px;
            "
        >

        <input 
            type="password"
            id="loginPassword"
            placeholder="Password"
            style="
                width:100%;
                padding:12px;
                margin-bottom:20px;
                border:1px solid #ccc;
                border-radius:10px;
            "
        >

        <button 
            onclick="login()"
            style="
                width:100%;
                padding:12px;
                border:none;
                border-radius:10px;
                background:#2c7be5;
                color:white;
                font-weight:bold;
                cursor:pointer;
            "
        >
            ACCEDI
        </button>

        <div id="loginError" style="
            color:red;
            margin-top:15px;
            font-size:0.9em;
        "></div>

    </div>
</div>
    
    <div class="container">
        <header>
            <div>
                <h1><a href="index.html" style="text-decoration: none; color: inherit;">CRUSCOTTO</a></h1>
                <div id="todayDate" style="font-size:0.9em; opacity:0.8;">Caricamento data...</div>
            </div>
            <div id="digitalClock" style="font-size:1.8em; font-weight:bold; font-family:monospace;">00:00:00</div>
            
            <button onclick="logout()" style="
    padding:8px 12px;
    border:none;
    border-radius:8px;
    background:#dc3545;
    color:white;
    cursor:pointer;
">
    Logout
</button>
        </header>

        <div class="note-toolbar-container">
            <div class="note-content">
                <span class="note-icon">📌</span>
                <input type="text" id="dailyNotes" placeholder="Inserisci note, promemoria o comunicazioni..." class="note-input">
                <button class="clear-note-btn" onclick="cancellaNote()" title="Svuota note">✕</button>
            </div>
        </div>       
        
    <div>
             <div id="info-reset" style="text-align:right; font-size:0.7em; color:#ff0000; margin-top:20px;">
        Ultimo aggiornamento: MAI
        </div>
    </div>    
        <div class="toolbar">
    <button class="btn-toolbar" style="background:var(--p);" onclick="togglePanel()">P ⚡ PP</button>
    <input type="text" id="search" placeholder="Cerca ..." onkeyup="applicaFiltri()">
    
    <div style="display:flex; align-items:center; gap:5px;">
        <span style="font-size:0.8em; font-weight:bold; color:var(--p);">ROOM:</span>
        <input type="number" id="roomInput" placeholder="n° ↕" min="101" max="221" style="width:60px;" 
               onfocus="this.oldValue = this.value;" 
               oninput="gestisciSaltoStanze(this); validaERicerca();">
    </div>

    <!-- PULSANTI RESET STILIZZATI -->
    <button class="btn-reset" onclick="resetDati('soloManuali')" title="Reset Giornaliero (solo variazioni)">
        🗑️ Reset Day
    </button>
    <button class="btn-reset-complete" onclick="resetDati('completo')" title="Reset Completo (tutti i dati)">
        ⚠️ Reset Full
    </button>

    <div id="connection-status" style="font-size:0.7em; padding:5px 10px; border-radius:20px; background:#d4edda; color:#155724;">
        🟢 Connesso
    </div>
</div>
        
        
        

        <div style="display:flex; gap:10px; margin-bottom:20px; overflow-x:auto; padding-bottom:5px;">
            <div class="day-box" style="border-bottom:4px solid var(--btn-color-1)" onclick="setTurno(1)">1° TURNO (18:30)</div>
            <div class="day-box" style="border-bottom:4px solid var(--btn-color-2)" onclick="setTurno(2)">2° TURNO (19:15)</div>
            <div class="day-box" style="border-bottom:4px solid var(--btn-color-3)" onclick="generaPopUpStampaConvitto()">STAMPA CONVITTO</div>
            <div class="day-box" style="border-bottom:4px solid var(--btn-color-4)" onclick="generaPopUpStampaDinner()">STAMPA DINNER</div>
        </div>

        <div id="listaStudenti"></div>
    </div>

    <div id="sidePanel" style="position:fixed; top:0; right:-350px; width:320px; height:100%; background:white; box-shadow:-5px 0 15px rgba(0,0,0,0.1); transition:0.3s; z-index:1000; padding:20px; overflow-y:auto; display:flex; flex-direction:column;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3 style="margin:0;">Gestione Permessi</h3>
            <button onclick="togglePanel()" style="border:none; background:none; font-size:1.5em; cursor:pointer;">&times;</button>
        </div>
        <hr>
        <h3 style="margin-top:10px;">Programmazione Assenze</h3>
        <select id="selectStudente" style="width:100%; margin-bottom:6px;">
            <option value="">-- Seleziona Nome --</option>
        </select>
        <select id="selectClasse" style="width:100%; margin-bottom:6px;">
            <option value="">-- Seleziona Classe --</option>
        </select>
        <input type="date" id="dataDal" style="width:100%; margin-bottom:6px;">
        <input type="date" id="dataAl" style="width:100%; margin-bottom:10px;">
        <button onclick="aggiungiAssenza()" style="width:100%; background:#e74c3c; color:white; border:none; padding:8px; border-radius:5px; cursor:pointer;">
            ➕ Aggiungi Assenza
        </button>
        <hr style="margin:20px 0;">
        <h3>Lista Assenze</h3>
        <div id="listaAssenze" style="margin-bottom:20px;"></div>
        <hr>
        <h3>Permessi Permanenti</h3>
        <div id="listaPermessiContent"></div>
    </div>

   
<script src="js/convittori.js"></script>
<script src="js/permessi.js"></script>
<script src="js/firebase-cruscotto-config.js"></script>
<script src="js/cruscotto-script.js"></script>
<script src="js/firebase-cruscotto-sync.js"></script>

     <script>
        // Debug: verifica che resetDati sia definita
        window.addEventListener('load', function() {
            if (typeof resetDati === 'function') {
                console.log('✅ resetDati è definita correttamente');
            } else {
                console.error('❌ resetDati NON è definita!');
            }
        });
    </script>
</body>
</html>

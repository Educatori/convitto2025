<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUSCOTTO 1.0 Firebase Realtime</title>
    <link rel="stylesheet" href="css/cruscotto-style.css">
</head>
<body>

    <div class="container">
        <header>
            <div>
                <h1><a href="index.html" style="text-decoration: none; color: inherit;">CRUSCOTTO</a></h1>
                <div id="todayDate" style="font-size:0.9em; opacity:0.8;">Caricamento data...</div>
            </div>
            <div id="digitalClock" style="font-size:1.8em; font-weight:bold; font-family:monospace;">00:00:00</div>
        </header>

        <div class="note-toolbar-container">
            <div class="note-content">
                <span class="note-icon">📌</span>
                <input type="text" id="dailyNotes" placeholder="Inserisci note condivise..." class="note-input">
                <button class="clear-note-btn" id="btnCancellaNote" title="Svuota note">✕</button>
            </div>
        </div>       

        <div class="toolbar">
            <button class="btn-toolbar" style="background:var(--p);" onclick="togglePanel()">VARIABILI</button>
            <input type="text" id="search" placeholder="Cerca ..." onkeyup="applicaFiltri()">
            
            <div style="display:flex; align-items:center; gap:5px;">
                <span style="font-size:0.8em; font-weight:bold; color:var(--p);">ROOM:</span>
                <input type="number" id="roomInput" placeholder="n° ↕" min="101" max="221" style="width:60px;" oninput="validaERicerca()">
            </div>

            <button class="btn-toolbar" style="background:var(--btn-reset);" id="btnReset">DAILY RESET</button>
            <div id="info-reset" style="text-align:right; font-size:0.7em; color:#ff0000; margin-top:20px;">
                Ultimo reset: <span id="lastResetTime">MAI</span>
            </div>
        </div>

        <div id="listaStudenti"></div>
    </div>

    <script src="js/convittori.js"></script>
    <script src="js/permessi.js"></script>

    <script type="module">
        // 1. IMPORTAZIONI FIREBASE
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, getDocs, writeBatch, serverTimestamp, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // 2. CONFIGURAZIONE (Sostituisci "AIzaSyAz..." con la tua vera API Key se necessario)
        const firebaseConfig = {
            apiKey: "AIzaSyAKBQJYiu1ConaCKOj_rlKQSOQaGVTinCc",
  authDomain: "cruscotto-438bc.firebaseapp.com",
  databaseURL: "https://cruscotto-438bc-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "cruscotto-438bc",
  storageBucket: "cruscotto-438bc.firebasestorage.app",
  messagingSenderId: "142955041436",
  appId: "1:142955041436:web:22be8db6e293bf14c55359",
  measurementId: "G-LK93GN5JNP"
        };

        // 3. INIZIALIZZAZIONE
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Rendiamo db e funzioni disponibili per gli altri file JS
        window.db = db;
        window.fb = { doc, setDoc, getDoc, onSnapshot, serverTimestamp, updateDoc, collection };

        // 4. ELEMENTI DOM
        const noteInput = document.getElementById('dailyNotes');
        const btnCancella = document.getElementById('btnCancellaNote');
        const lastResetSpan = document.getElementById('lastResetTime');
        const btnReset = document.getElementById('btnReset');

        // --- LOGICA STUDENTI (REALTIME) ---

        async function inizializzaStudenti() {
            const colRef = collection(db, "studenti");
            const snapshot = await getDocs(colRef);

            if (snapshot.empty && typeof studenticonvittori !== 'undefined') {
                console.log("Primo avvio: carico studenti su Cloud...");
                const batch = writeBatch(db);
                studenticonvittori.forEach((s) => {
                    const idDoc = `${s.cognome}_${s.nome}`.replace(/\s+/g, '_').toUpperCase();
                    batch.set(doc(db, "studenti", idDoc), {
                        ...s,
                        stato: "presente",
                        ultimoAggiornamento: serverTimestamp()
                    });
                });
                await batch.commit();
            }
        }

        // Funzione globale per cambiare stato (usata dai bottoni)
        window.cambiaStato = async (id, nuovoStato) => {
            const docRef = doc(db, "studenti", id);
            await updateDoc(docRef, { 
                stato: nuovoStato,
                ultimoAggiornamento: serverTimestamp()
            });
        };

        // --- LOGICA NOTE (REALTIME) ---

        noteInput.addEventListener('input', () => {
            setDoc(doc(db, "dashboard", "note_generali"), { 
                testo: noteInput.value 
            }, { merge: true });
        });

        onSnapshot(doc(db, "dashboard", "note_generali"), (snap) => {
            if (snap.exists() && document.activeElement !== noteInput) {
                noteInput.value = snap.data().testo || "";
            }
        });

        btnCancella.onclick = () => {
            if(confirm("Cancellare le note per tutti?")) {
                setDoc(doc(db, "dashboard", "note_generali"), { testo: "" });
            }
        };

        // --- LOGICA RESET & STATO SISTEMA ---

        btnReset.onclick = async () => {
            if(confirm("Eseguire il reset giornaliero? Questo azzera gli orari inseriti.")) {
                const ora = new Date().toLocaleString('it-IT');
                await setDoc(doc(db, "dashboard", "stato_sistema"), { ultimoReset: ora });
                // Opzionale: aggiungi qui logica per resettare tutti gli studenti a "presente"
            }
        };

        onSnapshot(doc(db, "dashboard", "stato_sistema"), (snap) => {
            if (snap.exists()) {
                lastResetSpan.innerText = snap.data().ultimoReset;
            }
        });

        // Avvio inizializzazione
        inizializzaStudenti();

    </script>

    <script src="js/cruscotto-script.js"></script>

</body>
</html>


<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Convitto & Dinner v2.0.a</title>
    
    <link rel="stylesheet" href="css/dashboard-style.css">
</head>
<body>

    <div class="container">
        <header>
            <div>
<h1>  CONVITTO & DINNER   </h1>
                
                <div id="todayDate" style="font-size:0.9em; opacity:0.8;">Caricamento data...</div>
            </div>
            <div id="digitalClock" style="font-size:1.8em; font-weight:bold; font-family:monospace;">00:00:00</div>
        </header>
        
<div class="note-container">
    <textarea 
        id="dailyNotes" 
        placeholder="Inserisci note, promemoria o comunicazioni..." 
        class="simple-note-textarea">
    </textarea>
    
</div>
        
        <div class="toolbar">
             <button class="btn-toolbar" style="background:var(--p);" onclick="togglePanel()">P⚡PP</button>
            <input type="text" id="search" placeholder="Cerca ..." onkeyup="applicaFiltri()">
            
            <div style="display:flex; align-items:center; gap:5px;">
                <span style="font-size:0.8em; font-weight:bold; color:var(--p);">ROOM:</span>
                <input type="number" id="roomInput" placeholder="n° ↕" min="101" max="221" style="width:60px;" 
                       onfocus="this.oldValue = this.value;" 
                       oninput="gestisciSaltoStanze(this); validaERicerca();">
            </div>

            <button class="btn-toolbar" style="background:var(--btn-reset);" onclick="resetDati()"> AZZERA</button>
         <div id="info-reset" style="text-align:right; font-size:0.7em; color:#ff0000; margin-top:20px;">
            Ultimo aggiornamento: MAI
        </div>
        </div>

        <div style="display:flex; gap:10px; margin-bottom:20px; overflow-x:auto; padding-bottom:5px;">
            <div class="day-box" style="border-bottom:4px solid var(--btn-color-1)" onclick="setTurno(1)">1° TURNO (18:30)</div>
            <div class="day-box" style="border-bottom:4px solid var(--btn-color-2)" onclick="setTurno(2)">2° TURNO (19:15)</div>
            <div class="day-box" style="border-bottom:4px solid var(--btn-color-3)" onclick="generaPopUpStampaConvitto()">STAMPA CONVITTO</div>
            <div class="day-box" style="border-bottom:4px solid var(--btn-color-4)" onclick="generaPopUpStampaDinner()">STAMPA DINNER</div>
        </div>

        
        <div id="listaStudenti"></div>
    </div>

 <div id="sidePanel" style="position:fixed; top:0; right:-350px; width:320px; height:100%; background:white; box-shadow:-5px 0 15px rgba(0,0,0,0.1); transition:0.3s; z-index:1000; padding:20px; overflow-y:auto; display:flex; flex-direction:column;">

    <!-- HEADER -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h3 style="margin:0;">Gestione Permessi</h3>
        <button onclick="togglePanel()" style="border:none; background:none; font-size:1.5em; cursor:pointer;">&times;</button>
    </div>

    <hr>

    <!-- 🔴 ASSENZE PROGRAMMATE -->
    <h3 style="margin-top:10px;">Programma Assenze</h3>

    <select id="selectStudente" style="width:100%; margin-bottom:6px;">
        <option value="">-- Seleziona Nome --</option>
    </select>

    <select id="selectClasse" style="width:100%; margin-bottom:6px;">
        <option value="">-- Seleziona Classe --</option>
    </select>

    <input type="date" id="dataDal" style="width:100%; margin-bottom:6px;">
    <input type="date" id="dataAl" style="width:100%; margin-bottom:10px;">

    <button onclick="aggiungiAssenza()" style="width:100%; background:#e74c3c; color:white; border:none; padding:8px; border-radius:5px; cursor:pointer;">
        ➕ Aggiungi Assenza
    </button>

    <hr style="margin:20px 0;">

    <!-- 🔵 LISTA ASSENZE -->
    <h3>Lista Assenze</h3>
    <div id="listaAssenze" style="margin-bottom:20px;"></div>

    <hr>

    <!-- 🟢 PERMESSI -->
    <h3>Permessi Permanenti</h3>
    <div id="listaPermessiContent"></div>

</div>

    <script src="js/interni.js"></script>
    <script src="js/permessi.js"></script>
    <script src="js/dashboard-script.js"></script>

    <script>
        function resetDati() {
            if(confirm("⚠ SEI SICURO? QUESTA AZIONE CANCELLERA' I DATI INSERITI SULLE CARD STUDENTI IN QUESTA SESSIONE ⚠")) {
                localStorage.removeItem('datiConvitto');
                const ora = new Date().toLocaleString('it-IT');
                localStorage.setItem('dataUltimoReset', ora);
                location.reload();
            }
        }
        
        
        const noteInput = document.getElementById('dailyNotes');

// 1. Appena la pagina si carica, recupera le note salvate
window.addEventListener('load', () => {
    const noteSalvate = localStorage.getItem('note_convitto');
    if (noteSalvate) {
        noteInput.value = noteSalvate;
    }
});

// 2. Ogni volta che scrivi, salva il testo in tempo reale
noteInput.addEventListener('input', () => {
    localStorage.setItem('note_convitto', noteInput.value);
});

// 3. Funzione per la X: svuota tutto e cancella la memoria
function cancellaNote() {
    if(confirm("⚠️ QUESTO CANCELLERA' DEFINITIVAMENTE LE NOTE ⚠️")) {
        noteInput.value = ''; // Svuota il campo visibile
        localStorage.removeItem('note_convitto'); // Cancella la memoria
    }
}
    </script>

    
    
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rooming List</title>
    <link rel="stylesheet" href="css/campus-theme.css">
    <link rel="stylesheet" href="css/rooming-style.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>
<div class="no-print">
    <button class="btn" onclick="window.print()">STAMPA</button>
</div>
<div class="header-container">
    <img src="assets/Logo.png" alt="Logo" class="print-logo">
    <h1><a href="index.html">Rooming List</a></h1>
</div>
<div class="grid-container" id="mainGrid"></div>

<script type="module">
    import { firebaseConfig } from "./js/firebase-config.js";
    firebase.initializeApp(firebaseConfig);
    import("./js/auth.js");

    const db = firebase.database();
    let studentiData = [];

    async function loadData() {
        const snap = await db.ref("studenti").once("value");
        const raw = snap.val();
        studentiData = raw ? Object.values(raw).filter(s => s.room && s.cognome) : [];
        render();
    }

    function render() {
        const stanze = {};
        studentiData.forEach(s => {
            if (!stanze[s.room]) stanze[s.room] = [];
            stanze[s.room].push(s);
        });
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = "";
        let headerP1 = false, headerP2 = false;
        Object.keys(stanze).sort((a,b) => parseInt(a)-parseInt(b)).forEach(room => {
            const r = parseInt(room);
            if (r >= 100 && r < 200 && !headerP1) {
                grid.insertAdjacentHTML('beforeend', '<div class="section-title">Piano 1 - Maschile</div>');
                headerP1 = true;
            } else if (r >= 200 && !headerP2) {
                grid.insertAdjacentHTML('beforeend', '<div class="section-title">Piano 2 - Femminile</div>');
                headerP2 = true;
            }
            const box = document.createElement('div');
            box.className = 'room-box';
            stanze[room].sort((a,b) => a.cognome.localeCompare(b.cognome));
            const occupantiHtml = stanze[room].map(s => {
                const infoGruppo = s.gruppo ? ` • ${s.gruppo}` : "";
                const infoPercorso = s.percorso ? ` <span class="percorso-tag">${s.percorso}</span>` : "";
                return `<div class="row-student"><span class="student-name"><b>${s.cognome}</b> ${s.nome}</span><span class="student-details">${infoPercorso} ${s.classe}${infoGruppo}</span></div>`;
            }).join('');
            box.innerHTML = `<div class="room-info">${room}</div><div class="occupants-list">${occupantiHtml}</div>`;
            grid.appendChild(box);
        });
    }

    document.addEventListener("authReady", loadData);
</script>
</body>
</html>

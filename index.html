<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indice</title>

    <style>
        :root {
            --bg-light: linear-gradient(135deg, #dfe9f3, #ffffff);
            --bg-dark: linear-gradient(135deg, #0f172a, #1e293b);
            --card-light: rgba(255,255,255,0.6);
            --card-dark: rgba(30,41,59,0.6);
            --primary: #1a3a5a;
            --accent: #4a90e2;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui;
            background: var(--bg-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            transition: 0.4s;
        }

        /* DARK MODE AUTO */
        @media (prefers-color-scheme: dark) {
            body { background: var(--bg-dark); color: white; }
            .link-card { background: var(--card-dark); }
            .link-card span { color: white; }
            .link-card svg { stroke: #e2e8f0; fill: none; }
            #todayDate { color: #cbd5e1; }
        }

        /* HEADER & CLOCK */
        .header-container {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 30px;
            letter-spacing: 4px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #4a90e2, #6dd5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #todayDate {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary);
            opacity: 0.8;
            margin-bottom: 5px;
        }

        #digitalClock {
            font-size: 2rem;
            font-weight: 700;
            font-family: 'Courier New', Courier, monospace;
            margin-bottom: 20px;
        }

        /* GRID */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(3, 130px);
            gap: 30px;
        }

        /* CARD */
        .link-card {
            background: var(--card-light);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            height: 130px;
            width: 130px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transition: all 0.35s cubic-bezier(.25,.8,.25,1);
            position: relative;
            overflow: hidden;
        }

        .link-card::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: rotate(25deg);
            top: -100%;
            left: -100%;
            transition: 0.5s;
        }

        .link-card:hover::before { top: 100%; left: 100%; }

        .link-card svg { 
            width: 42px; 
            height: 42px; 
            stroke: var(--primary); 
            stroke-width: 1.8;
            fill: none;
            transition: 0.3s; 
        }
        
        .link-card span { 
            font-size: 13px; 
            font-weight: 500; 
            color: var(--primary); 
        }

        .link-card:hover { 
            transform: translateY(-10px) scale(1.07); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.25); 
        }
        
        .link-card:active { transform: scale(0.95); }

        @media (max-width: 600px) {
            .links-grid { grid-template-columns: repeat(2, 130px); }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>INDICE</h1>
        <div id="todayDate">Caricamento...</div>
        <div id="digitalClock">00:00:00</div>
    </div>

    <div class="links-grid">
        <!-- Dashboard - Icona cruscotto/dashboard -->
        <a href="dashboard.html" class="link-card">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="3" y="3" width="8" height="8" rx="1"/>
                <rect x="13" y="3" width="8" height="8" rx="1"/>
                <rect x="3" y="13" width="8" height="8" rx="1"/>
                <rect x="13" y="13" width="8" height="8" rx="1"/>
            </svg>
            <span>Dashboard</span>
        </a>

        <!-- Cloud - Icona nuvola più elegante -->
        <a href="roomcloud.html" class="link-card">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M17.5 19H6.5C4.01472 19 2 16.9853 2 14.5C2 12.0147 4.01472 10 6.5 10C6.82789 10 7.14658 10.0364 7.45315 10.1058C8.28548 8.26313 10.1514 7 12.3036 7C15.176 7 17.5285 9.15521 17.8305 11.9581C17.8861 11.9858 17.9429 12 18 12C20.2091 12 22 13.7909 22 16C22 18.2091 20.2091 20 18 20H17.5Z"/>
            </svg>
            <span>Cloud</span>
        </a>

        <!-- Bus - Icona autobus moderna -->
        <a href="bus.html" class="link-card">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M4 17H20M4 17V7C4 5.89543 4.89543 5 6 5H18C19.1046 5 20 5.89543 20 7V17M4 17V19M20 17V19M6 9H10M14 9H18M6 13H12M16 13H18M6.5 8.5H9.5M14.5 8.5H17.5"/>
                <circle cx="7" cy="17" r="2"/>
                <circle cx="17" cy="17" r="2"/>
            </svg>
            <span>Bus</span>
        </a>

        <!-- Uscita - Icona porta/uscita -->
        <a href="uscita.html" class="link-card">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M15 12H3M12 15L15 12L12 9M9 5V4C9 3.44772 9.44772 3 10 3H19C19.5523 3 20 3.44772 20 4V20C20 20.5523 19.5523 21 19 21H10C9.44772 21 9 20.5523 9 20V19"/>
            </svg>
            <span>Uscita</span>
        </a>

        <!-- Rooming - Icona stanza/letto con chiave -->
        <a href="rooming.html" class="link-card">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M3 7V21H21V7M3 7L12 3L21 7M3 7H21M7 11H17M7 14H17M7 17H13"/>
            </svg>
            <span>Rooming</span>
        </a>

        <!-- Transfer - Icona navetta/trasferimento -->
        <a href="transfer.html" class="link-card">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M4 12H20M20 12L17 9M20 12L17 15M8 6L5 9M5 9L8 12M5 9H19M16 18L19 15M19 15L16 12"/>
            </svg>
            <span>Transfer</span>
        </a>
        
        <!-- Cruscotto - Icona dashboard/controllo -->
        <a href="cruscotto.html" class="link-card">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="12" cy="12" r="9"/>
                <path d="M12 8V12L14 14"/>
                <path d="M6 3L3 6"/>
                <path d="M18 3L21 6"/>
            </svg>
            <span>Cruscotto</span>
        </a>
    </div>

    <script>
        function updateDateTime() {
            const now = new Date();
            
            // Formattazione Data
            const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            document.getElementById('todayDate').textContent = now.toLocaleDateString('it-IT', options);
            
            // Formattazione Ora
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('digitalClock').textContent = `${hours}:${minutes}:${seconds}`;
        }

        // Esegui subito e poi ogni secondo
        setInterval(updateDateTime, 1000);
        updateDateTime();
    </script>

</body>
</html>

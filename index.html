<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indice v1.0</title>

    <style>
        :root {
            --bg-light: linear-gradient(135deg, #dfe9f3, #ffffff);
            --bg-dark: linear-gradient(135deg, #0f172a, #1e293b);
            --card-light: rgba(255,255,255,0.6);
            --card-dark: rgba(30,41,59,0.6);
            --primary: #1a3a5a;
            --accent: #4a90e2;
            
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui;
            background: var(--bg-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            transition: 0.4s;
        }

        /* DARK MODE AUTO */
        @media (prefers-color-scheme: dark) {
            body { background: var(--bg-dark); color: white; }
            .link-card { background: var(--card-dark); }
            .link-card span { color: white; }
            .link-card svg { stroke: #e2e8f0; fill: none; }
            #todayDate { color: white; }
        }

        /* HEADER & CLOCK */
        .header-container {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 30px;
            letter-spacing: 4px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #4a90e2, #6dd5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #todayDate {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary);
            opacity: 0.8;
            margin-bottom: 5px;
        }

        #digitalClock {
            font-size: 2rem;
            font-weight: 700;
            font-family: 'Courier New', Courier, monospace;
            margin-bottom: 20px;
        }

        /* GRID */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(3, 130px);
            gap: 30px;
        }

        /* CARD */
        .link-card {
            background: var(--card-light);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            height: 130px;
            width: 130px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transition: all 0.35s cubic-bezier(.25,.8,.25,1);
            position: relative;
            overflow: hidden;
        }

        .link-card::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: rotate(25deg);
            top: -100%;
            left: -100%;
            transition: 0.5s;
        }

        .link-card:hover::before { top: 100%; left: 100%; }

        .link-card svg { 
            width: 42px; 
            height: 42px; 
            stroke: var(--primary); 
            stroke-width: 1.8;
            fill: none;
            transition: 0.3s; 
        }
        
        .link-card span { 
            font-size: 13px; 
            font-weight: 500; 
            color: var(--primary); 
        }

        .link-card:hover { 
            transform: translateY(-10px) scale(1.07); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.25); 
        }
        
        .link-card:active { transform: scale(0.95); }

        @media (max-width: 600px) {
            .links-grid { grid-template-columns: repeat(2, 130px); }
        }
    </style>
</head>
<body>

    <script>
        function updateDateTime() {
            const now = new Date();
            
            // Formattazione Data
            const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            document.getElementById('todayDate').textContent = now.toLocaleDateString('it-IT', options);
            
            // Formattazione Ora
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('digitalClock').textContent = `${hours}:${minutes}:${seconds}`;
        }

        // Esegui subito e poi ogni secondo
        setInterval(updateDateTime, 1000);
        updateDateTime();
    </script>

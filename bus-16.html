<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>BUS ore 16 — Schema Settimanale Pomeriggio</title>
    <link rel="stylesheet" href="css/campus-theme.css">
    <link rel="stylesheet" href="css/bus-style.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>
<div class="no-print"><button class="btn" onclick="window.print()">STAMPA</button></div>
<div class="header-main">
    <img src="assets/Logo.png" alt="Logo" class="print-logo">
    <h1><a href="index.html">Settimanale Pomeriggio</a></h1>
</div>
<div class="grid-wrapper" id="mainWrapper">
    <div class="macro-column"><div class="column-header"><div class="cell-class">Classe</div><div class="cell-name">Nome</div><div class="cell-check">LU</div><div class="cell-check">MA</div><div class="cell-check">ME</div><div class="cell-check">GI</div></div><div id="col0"></div></div>
    <div class="macro-column"><div class="column-header"><div class="cell-class">Classe</div><div class="cell-name">Nome</div><div class="cell-check">LU</div><div class="cell-check">MA</div><div class="cell-check">ME</div><div class="cell-check">GI</div></div><div id="col1"></div></div>
    <div class="macro-column"><div class="column-header"><div class="cell-class">Classe</div><div class="cell-name">Nome</div><div class="cell-check">LU</div><div class="cell-check">MA</div><div class="cell-check">ME</div><div class="cell-check">GI</div></div><div id="col2"></div></div>
</div>

<script type="module">
    import { firebaseConfig } from "./js/firebase-config.js";
    firebase.initializeApp(firebaseConfig);
    import("./js/auth.js");

    const db = firebase.database();
    const giorni = ["LU", "MA", "ME", "GI"];
    function getWeekKey() { const now = new Date(); return `${now.getFullYear()}-W${Math.ceil((now - new Date(now.getFullYear(),0,1)) / 86400000 / 7)}`; }
    let studentiList = [];
    let presenzeMap = {}; // struttura: { studenteId: [bool, bool, bool, bool] }

    async function caricaDati() {
        const snapStud = await db.ref("studenti").once("value");
        const studentiRaw = snapStud.val();
        studentiList = studentiRaw ? Object.values(studentiRaw) : [];
        studentiList = studentiList.filter(s => {
            const cls = (s.classe || "").toUpperCase();
            return !["2A","2B"].includes(cls) && !cls.includes("P") && s.cognome;
        });
        studentiList.sort((a,b) => {
            const compClasse = a.classe.localeCompare(b.classe, undefined, { numeric: true });
            if (compClasse !== 0) return compClasse;
            return (a.cognome || "").localeCompare(b.cognome || "");
        });
        const weekKey = getWeekKey();
        const snapPres = await db.ref(`presenze_settimanali/${weekKey}`).once("value");
        presenzeMap = snapPres.val() || {};
        renderizza();
    }

    function salvaPresenzeSettimanali(studId, giornoIdx, checked) {
        if (!presenzeMap[studId]) presenzeMap[studId] = [false, false, false, false];
        presenzeMap[studId][giornoIdx] = checked;
        db.ref(`presenze_settimanali/${getWeekKey()}/${studId}`).set(presenzeMap[studId]);
    }

    function renderizza() {
        const itemsPerCol = Math.ceil(studentiList.length / 3);
        for (let c=0; c<3; c++) {
            const colDiv = document.getElementById(`col${c}`);
            colDiv.innerHTML = "";
            const start = c * itemsPerCol;
            const end = Math.min(start + itemsPerCol, studentiList.length);
            for (let i=start; i<end; i++) {
                const s = studentiList[i];
                const row = document.createElement("div");
                row.className = "grid-row";
                const infoClasse = `${s.classe} ${s.percorso || ""} ${s.gruppo ? "• "+s.gruppo : ""}`;
                row.innerHTML = `
                    <div class="cell-class">${infoClasse}</div>
                    <div class="cell-name" style="cursor:pointer"><b>${s.cognome}</b> ${s.nome}</div>
                    ${giorni.map((_, idx) => `<div class="cell-check"><input type="checkbox" class="check-${idx}"></div>`).join('')}
                `;
                const studId = `${s.cognome}_${s.nome}_${s.room}`.replace(/[^a-zA-Z0-9_-]/g, '_');
                const pres = presenzeMap[studId] || [false, false, false, false];
                for (let idx=0; idx<giorni.length; idx++) {
                    const chk = row.querySelector(`.check-${idx}`);
                    chk.checked = pres[idx];
                    chk.addEventListener("change", (e) => { e.stopPropagation(); salvaPresenzeSettimanali(studId, idx, chk.checked); });
                }
                row.querySelector(".cell-name").addEventListener("click", () => { row.classList.toggle("row-crossed"); });
                colDiv.appendChild(row);
            }
        }
    }

    document.addEventListener("authReady", () => { caricaDati(); });
</script>
</body>
</html>
